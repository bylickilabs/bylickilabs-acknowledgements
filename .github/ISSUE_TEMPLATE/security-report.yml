name: Sicherheitsmeldung
description: Melde ein potenzielles Sicherheitsproblem, das bylickilabs.de oder eine BYLICKILABS Webkomponente betrifft.
title: "[SECURITY] "
assignees:
  - bylickilabs

body:
  - type: markdown
    attributes:
      value: |
        # BYLICKILABS Sicherheitsmeldung

        Vielen Dank, dass du ein potenzielles Sicherheitsproblem auf **bylickilabs.de** oder einer zugehörigen BYLICKILABS Komponente verantwortungsvoll meldest.

        **Wichtig:** Dieses Formular erstellt ein **öffentliches GitHub Issue**. Gib **keine** Passwörter, API Keys, Access Tokens, Private Keys, personenbezogenen Daten, vertraulichen Informationen oder unnötigen Exploit Details an. Wenn der Befund sensible Informationen enthält, die nicht öffentlich zugänglich sein sollten, übermittle diese Details nicht über dieses Formular.

        Nach dem Absenden wird die Meldung geprüft und technisch verifiziert. Wird der Befund bestätigt, kann die betroffene BYLICKILABS Komponente korrigiert und der Security Researcher anschließend für eine Aufnahme in die Security Acknowledgements berücksichtigt werden.

  - type: input
    id: researcher
    attributes:
      label: Name oder Alias des Security Researchers
      description: Gib den Namen, Alias oder das Pseudonym an, das mit dieser Meldung verknüpft werden soll.
      placeholder: "Beispiel: researcher-name"
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: Kontaktinformationen
      description: Optionale Kontaktinformationen für mögliche Rückfragen.
      placeholder: GitHub Profil, E-Mail-Adresse oder Website
    validations:
      required: false

  - type: dropdown
    id: affected-area
    attributes:
      label: Betroffener Bereich
      description: Wähle alle BYLICKILABS Bereiche aus, die von dem Befund betroffen sind.
      multiple: true
      options:
        - bylickilabs.de
        - security-acknowledgements.html
        - Navigation
        - Footer
        - Update Center
        - Download Center
        - Tool Center
        - Security Research
        - Petition
        - GitHub Projekte
        - Kontakt
        - Übersetzungssystem
        - CSS
        - JavaScript
        - Sonstiges
    validations:
      required: true

  - type: input
    id: affected-component
    attributes:
      label: Betroffene URL oder Komponente
      description: Gib die betroffene URL, Seite, Datei, Komponente oder Funktion an.
      placeholder: "Beispiel: https://bylickilabs.de/example.html"
    validations:
      required: true

  - type: dropdown
    id: vulnerability-category
    attributes:
      label: Kategorie der Schwachstelle
      description: Wähle die Kategorie aus, die den Befund am besten beschreibt.
      options:
        - Cross Site Scripting (XSS)
        - Injection
        - Zugriffskontrolle
        - Authentifizierung
        - Autorisierung
        - Offenlegung von Informationen
        - Sicherheitsfehlkonfiguration
        - Offene Weiterleitung
        - Cross Site Request Forgery (CSRF)
        - Unsichere direkte Objektreferenz (IDOR)
        - Clientseitige Sicherheit
        - HTTP Sicherheitsheader
        - Abhängigkeitsbezogen
        - Sonstiges
        - Unbekannt
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Beschreibe kurz das Sicherheitsproblem und deine Beobachtung. Gib keine unnötigen sensiblen Details an.
      placeholder: Beschreibe das identifizierte Problem, wo es auftritt und den relevanten technischen Kontext.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Schritte zur Reproduktion
      description: Beschreibe die minimal erforderlichen Schritte zur Reproduktion des Problems, ohne Secrets oder unnötige sensible Daten anzugeben.
      placeholder: |
        1. Öffne ...
        2. Navigiere zu ...
        3. Führe ... aus
        4. Beobachte ...
    validations:
      required: true

  - type: textarea
    id: observed-behavior
    attributes:
      label: Beobachtetes Verhalten
      description: Beschreibe, was tatsächlich passiert, wenn das Problem reproduziert wird.
      placeholder: Beschreibe das beobachtete Verhalten.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Erwartetes Verhalten
      description: Beschreibe, wie sich die betroffene Komponente aus Sicherheitssicht verhalten sollte.
      placeholder: Beschreibe das erwartete Verhalten.
    validations:
      required: false

  - type: textarea
    id: security-impact
    attributes:
      label: Sicherheitsauswirkung
      description: Erläutere die möglichen sicherheitsrelevanten Auswirkungen des Befunds.
      placeholder: Beschreibe, was ein Angreifer potenziell erreichen könnte oder welche Sicherheitseigenschaft betroffen ist.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Geschätzter Schweregrad
      description: Wähle den von dir geschätzten Schweregrad aus. BYLICKILABS kann diesen während der Prüfung neu bewerten.
      options:
        - Informativ
        - Niedrig
        - Mittel
        - Hoch
        - Kritisch
        - Unbekannt
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Umgebung
      description: Ergänze relevante Informationen zur verwendeten Umgebung, sofern zutreffend.
      value: |
        Betriebssystem:
        Browser:
        Browser Version:
        Gerät:
        Zusätzliche Informationen:
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: Technische Nachweise
      description: Füge bereinigte Screenshots, Konsolenausgaben, Request oder Response Informationen oder andere nicht sensible Nachweise hinzu. Dateien können in GitHub an dieses Feld angehängt werden.
      placeholder: Füge hier nicht sensible technische Nachweise hinzu.
    validations:
      required: false

  - type: textarea
    id: remediation
    attributes:
      label: Vorgeschlagene Behebung
      description: Optionale technische Empfehlung zur Behebung oder Risikoreduzierung.
      placeholder: Beschreibe einen möglichen technischen Lösungsansatz.
    validations:
      required: false

  - type: input
    id: discovery-date
    attributes:
      label: Entdeckungsdatum
      description: Gib das Datum an, an dem das Problem identifiziert wurde.
      placeholder: TT.MM.JJJJ
    validations:
      required: false

  - type: dropdown
    id: disclosure-status
    attributes:
      label: Offenlegungsstatus
      description: Gib an, ob Informationen zu diesem Problem bereits an anderer Stelle veröffentlicht wurden.
      options:
        - Nicht öffentlich offengelegt
        - Teilweise offengelegt
        - Öffentlich offengelegt
        - Unbekannt
    validations:
      required: true

  - type: dropdown
    id: acknowledgement-preference
    attributes:
      label: Wunsch zur öffentlichen Anerkennung
      description: Wähle aus, wie du nach erfolgreicher Prüfung und gegebenenfalls Behebung öffentlich anerkannt werden möchtest.
      options:
        - Öffentliche Anerkennung mit meinem echten Namen
        - Öffentliche Anerkennung mit meinem Alias oder Pseudonym
        - Anonyme Anerkennung
        - Keine öffentliche Anerkennung gewünscht
    validations:
      required: true

  - type: input
    id: public-name
    attributes:
      label: Bevorzugter öffentlicher Name oder Alias
      description: Wenn du eine öffentliche Anerkennung wünschst, gib den exakten Namen oder Alias an, der angezeigt werden soll.
      placeholder: "Beispiel: Max Mustermann oder researcher-name"
    validations:
      required: false

  - type: input
    id: public-profile
    attributes:
      label: Öffentliches Profil
      description: Optionales GitHub Profil, Website oder berufliches Profil, das mit der Anerkennung verknüpft werden soll.
      placeholder: https://github.com/username
    validations:
      required: false

  - type: checkboxes
    id: responsible-disclosure
    attributes:
      label: Bestätigung zur verantwortungsvollen Offenlegung
      description: Bestätige vor dem Absenden jede der folgenden Aussagen.
      options:
        - label: Ich habe BYLICKILABS Systeme nicht vorsätzlich beschädigt oder unnötig beeinträchtigt.
          required: true
        - label: Ich habe keine unnötigen personenbezogenen oder vertraulichen Informationen aufgerufen, kopiert oder offengelegt.
          required: true
        - label: Ich habe keine Zugangsdaten, Secrets oder andere sensible Informationen veröffentlicht.
          required: true
        - label: Ich habe vor einer Behebung keine technischen Details vorsätzlich veröffentlicht, die ein unnötiges zusätzliches Risiko verursachen könnten.
          required: true
        - label: Ich habe keine Denial of Service Angriffe oder vergleichbare Tests durchgeführt, die die Verfügbarkeit von Systemen beeinträchtigen könnten.
          required: true
        - label: Ich habe keine Social Engineering, Phishing oder Täuschungsmethoden gegenüber Personen eingesetzt.
          required: true
        - label: Ich habe keine Systeme, Konten oder Dienste Dritter getestet, die nicht ausdrücklich zum BYLICKILABS Umfeld gehören.
          required: true
        - label: Ich habe meine Tests auf das zur Verifikation der gemeldeten Schwachstelle erforderliche Maß begrenzt.
          required: true
        - label: Ich habe Tests beendet oder eingeschränkt, sobald ein erhöhtes Risiko für Daten, Systeme oder Dritte erkennbar wurde.
          required: true
        - label: Ich werde zusätzliche technische Details auf Anfrage vertraulich behandeln, bis eine angemessene Prüfung und gegebenenfalls Behebung erfolgt ist.
          required: true
        - label: Die Angaben in dieser Meldung sind nach meinem besten Wissen korrekt.
          required: true

  - type: textarea
    id: additional-information
    attributes:
      label: Zusätzliche Informationen
      description: Ergänze weitere nicht sensible Informationen, die bei der Prüfung oder beim Verständnis des Befunds helfen können.
      placeholder: Zusätzlicher Kontext, Referenzen oder Hinweise.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ━━━━━━━━━━━━ ◆ ━━━━━━━━━━━━

        **BYLICKILABS // Verantwortungsvolle Sicherheitsforschung**

        Das Absenden einer Meldung garantiert nicht automatisch eine öffentliche Anerkennung. Jeder Befund wird individuell geprüft. Nach technischer Verifikation und, falls erforderlich, erfolgreicher Behebung kann eine Anerkennung in **security-acknowledgements.html** aufgenommen werden.
